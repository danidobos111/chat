<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; }
    #login { max-width: 300px; margin: 100px auto; }
    #login input { display: block; width: 100%; margin: 8px 0; padding: 8px; box-sizing: border-box; }
    #login button { width: 100%; padding: 8px; cursor: pointer; }
    #login select { display: block; width: 100%; margin: 8px 0; padding: 8px; }
    #chat { display: none; max-width: 600px; margin: 0 auto; }
    #messages { border: 1px solid #ccc; height: 70vh; overflow-y: auto; padding: 10px; margin-bottom: 8px; }
    .msg { margin: 6px 0; }
    .msg b { margin-right: 6px; }
    #input-row { display: flex; gap: 8px; }
    #input-row textarea { flex: 1; padding: 8px; resize: none; }
    #input-row button { padding: 8px 16px; cursor: pointer; }
    #status { font-size: 12px; color: gray; margin-bottom: 6px; }
    #error { color: red; font-size: 13px; }
  </style>
</head>
<body>

<div id="login">
  <h2>Chat belépés</h2>
  <select id="username">
    <option value="">-- Válassz nevet --</option>
    <option value="User1">User1</option>
    <option value="User2">User2</option>
  </select>
  <input type="password" id="pw" placeholder="Jelszó" />
  <div id="error"></div>
  <button onclick="login()">Belépés</button>
</div>

<div id="chat">
  <div id="status"></div>
  <div id="messages"></div>
  <div id="input-row">
    <textarea id="msg" rows="2" placeholder="Üzenet..."></textarea>
    <button onclick="send()">Küld</button>
  </div>
  <button onclick="logout()" style="margin-top:8px">Kilépés</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue, set, remove, onDisconnect, serverTimestamp, query, limitToLast }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB-4SBrAVNVhyGiw48XsPozc4_fHogK7QM",
  authDomain: "titkos-chat.firebaseapp.com",
  databaseURL: "https://titkos-chat-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "titkos-chat",
  storageBucket: "titkos-chat.firebasestorage.app",
  messagingSenderId: "477266640053",
  appId: "1:477266640053:web:f0328809e2875874de12fc"
};

const PASSWORD = "1234";
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let me, presRef;

window.login = async function() {
  me = document.getElementById('username').value;
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('error');
  err.textContent = '';

  if (!me) { err.textContent = 'Válassz nevet!'; return; }
  if (pw !== PASSWORD) { err.textContent = 'Hibás jelszó!'; return; }

  const snap = await new Promise(r => onValue(ref(db, 'presence'), r, { onlyOnce: true }));
  const online = snap.val() ? Object.values(snap.val()) : [];
  if (online.includes(me)) { err.textContent = me + ' már be van lépve!'; return; }
  if (online.length >= 2) { err.textContent = 'A chat tele van (2/2)!'; return; }

  presRef = ref(db, 'presence/' + me);
  await set(presRef, me);
  onDisconnect(presRef).remove();

  document.getElementById('login').style.display = 'none';
  document.getElementById('chat').style.display = 'block';

  // presence figyelés
  onValue(ref(db, 'presence'), snap => {
    const online = snap.val() ? Object.values(snap.val()) : [];
    document.getElementById('status').textContent = 'Online: ' + (online.join(', ') || 'senki');
  });

  // üzenetek figyelése
  onValue(query(ref(db, 'messages'), limitToLast(200)), snap => {
    const box = document.getElementById('messages');
    box.innerHTML = '';
    snap.forEach(c => {
      const d = c.val();
      const div = document.createElement('div');
      div.className = 'msg';
      const time = d.ts ? new Date(d.ts).toLocaleTimeString('hu-HU', {hour:'2-digit',minute:'2-digit'}) : '';
      div.innerHTML = '<b>' + d.user + '</b>' + (time ? '[' + time + '] ' : '') + escHtml(d.text);
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  });
};

window.send = async function() {
  const inp = document.getElementById('msg');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  await push(ref(db, 'messages'), { user: me, text, ts: serverTimestamp() });
};

window.logout = async function() {
  if (presRef) await remove(presRef);
  location.reload();
};

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && document.getElementById('chat').style.display === 'block') {
    e.preventDefault();
    window.send();
  }
});

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
